<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page bloquée</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="blocked">
  <main class="warn-box">
    <header class="warn-head">
      <img src="icons/icon.svg" alt="" width="44" height="44">
      <div>
        <h1>Site de phishing probable</h1>
        <p>Fingerprint Shield a bloqué cette page avant son chargement.</p>
      </div>
    </header>
    <section class="warn-body">
      <div class="result-host" id="host"></div>
      <div class="url" id="url"></div>
      <div id="why" class="result"><p class="msg">Analyse en cours…</p></div>
    </section>
    <footer class="warn-actions">
      <button id="back">Retourner en lieu sûr</button>
      <button id="continue" class="risk">Continuer quand même</button>
      <span class="spacer"></span>
      <button id="trust" class="link">Toujours faire confiance à ce site</button>
    </footer>
  </main>
  <script src="defaults.js"></script>
  <script src="shared.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
