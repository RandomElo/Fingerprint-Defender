<!doctype html>
<meta charset="utf-8">
<title>page hôte</title>
<script>
  window.addEventListener("message", (e) => {
    if (e.data && e.data.hash) {
      window.__result = e.data;
      window.__ready = true;
    }
  });
  const f = document.createElement("iframe");
  f.src = new URLSearchParams(location.search).get("frame");
  document.addEventListener("DOMContentLoaded", () => document.body.append(f));
</script>
<body>hôte
